<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none">
  <title>粘贴即上传功能示意</title>
  <desc>剪贴板截图通过键盘快捷键进入网页上传框。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#c4d1e0"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m2 1 6 4-6 4" stroke="#426c9a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#edf2f8"/>
  <rect x="32" y="91" width="656" height="281" rx="24" fill="#f6f9fc" stroke="#d4dfea" stroke-width="2"/>
  <rect x="33" y="92" width="654" height="279" rx="23" fill="url(#grid)"/>
  <g font-family="Geist, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="36" y="40" width="9" height="24" rx="4.5" fill="#426c9a"/>
    <text x="59" y="60" fill="#28394c" font-size="23" font-weight="600">粘贴即上传</text>
    <text x="185" y="413" text-anchor="middle" fill="#28394c" font-size="23" font-weight="600">剪贴板</text>
    <text x="185" y="442" text-anchor="middle" fill="#53677e" font-size="17">截图 / 图片</text>
    <text x="566" y="413" text-anchor="middle" fill="#28394c" font-size="23" font-weight="600">网页上传框</text>
    <text x="566" y="442" text-anchor="middle" fill="#53677e" font-size="17">图片直接就位</text>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="91" y="151" width="186" height="154" rx="15" fill="#fcfdff" stroke="#344c65" stroke-width="3"/>
    <rect x="105" y="165" width="158" height="125" rx="7" fill="#e9f0f8" stroke="#b7c9dd" stroke-width="2"/>
    <path d="m117 270 36-39 22 20 24-31 51 50H117Z" fill="#d1e0ef" stroke="#7892ac" stroke-width="2"/>
    <circle cx="222" cy="188" r="9" fill="#91aecb"/>
    <path d="M296 227h137" stroke="#426c9a" stroke-width="3" stroke-dasharray="5 8" marker-end="url(#arrow)"/>
    <rect x="326" y="173" width="93" height="37" rx="18.5" fill="#e5eef8" stroke="#bfd0e3" stroke-width="2"/>
    <text x="372" y="198" text-anchor="middle" fill="#36587b" font-family="Geist, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">Ctrl + V</text>
    <rect x="484" y="142" width="164" height="171" rx="14" fill="#fcfdff" stroke="#344c65" stroke-width="3"/>
    <path d="M503 164h126m-126 17h82" stroke="#c2d1e0" stroke-width="3"/>
    <rect x="501" y="202" width="130" height="89" rx="9" fill="#e8f0f8" stroke="#8ca7c2" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="518" y="218" width="38" height="47" rx="5" fill="#fff" stroke="#426c9a" stroke-width="2"/>
    <path d="m524 256 8-10 6 5 7-9 7 14h-28Z" fill="#d4e3f1" stroke="#7290ac" stroke-width="1.5"/>
    <circle cx="547" cy="226" r="3" fill="#8aa8c4"/>
    <path d="m571 234 7 7 15-17" stroke="#426c9a" stroke-width="3"/>
    <path d="M571 257h42" stroke="#a4b8cd" stroke-width="2"/>
  </g>
</svg>
