    <p class="eyebrow">抽象示意图绘制</p>
    <h1 id="title">车间布局和算法示意图</h1>
    <p class="intro-copy">这四张图是我写本科论文时画的。我用坐标标出车间里的作业区，用线条画出搬运路线。讲到粒子群算法时，我用鸟群来打比方。</p>
  </section>
  <div class="gallery" data-image-gallery>
    <figure class="diagram">
      <a class="diagram-image" data-image-item href="./research-roadmap.png" aria-label="查看研究技术路线原图">
        <img src="./research-roadmap.png" width="809" height="751" alt="车间布局优化从理论基础、现状分析到布局设计和方案评价的分层流程图">
      </a>
      <figcaption>
        <div class="caption-top"><h2>研究技术路线</h2><a class="original" href="./research-roadmap.png" aria-label="查看研究技术路线原图">查看原图</a></div>
        <p>用分层流程图串起现状分析、布局方案设计和优化前后对比。</p>
      </figcaption>
    </figure>
    <figure class="diagram">
      <a class="diagram-image" data-image-item href="./unit-coordinates.png" aria-label="查看作业单元坐标原图">
        <img src="./unit-coordinates.png" width="829" height="675" alt="同一平面坐标系中两个矩形作业单元的尺寸、中心位置和横纵间距">
      </a>
      <figcaption>
        <div class="caption-top"><h2>作业单元坐标</h2><a class="original" href="./unit-coordinates.png" aria-label="查看作业单元坐标原图">查看原图</a></div>
        <p>用坐标轴、中心线和尺寸箭头表达单元的位置、长宽及间距。</p>
      </figcaption>
    </figure>
    <figure class="diagram">
      <a class="diagram-image diagram-image-wide" data-image-item href="./logistics-routes.png" aria-label="查看物流搬运路线原图">
        <img src="./logistics-routes.png" width="1134" height="595" loading="lazy" alt="用粗实线、细实线和点划线区分车间各区域之间的高、中、低物流量">
      </a>
      <figcaption>
        <div class="caption-top"><h2>物流搬运路线</h2><a class="original" href="./logistics-routes.png" aria-label="查看物流搬运路线原图">查看原图</a></div>
        <p>用线型和粗细区分物流量，呈现各区域之间的搬运路径与交叉关系。</p>
      </figcaption>
    </figure>
    <figure class="diagram">
      <a class="diagram-image diagram-image-wide" data-image-item href="./particle-swarm.png" aria-label="查看粒子群算法原图">
        <img src="./particle-swarm.png" width="912" height="492" loading="lazy" alt="以鸟群为类比，展示当前速度、个体最优位置和群体最优位置如何影响下一步位置">
      </a>
      <figcaption>
        <div class="caption-top"><h2>粒子群算法原理</h2><a class="original" href="./particle-swarm.png" aria-label="查看粒子群算法原图">查看原图</a></div>
        <p>借鸟群运动解释粒子如何结合当前速度、个体最优与群体最优来更新位置。</p>
      </figcaption>
    </figure>
